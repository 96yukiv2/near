name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  profile-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - name: Test profile permissions through the API
        shell: bash
        run: |
          eval "$(npx supabase status -o env)"
          export TEST_SUPABASE_URL="$API_URL"
          export TEST_SUPABASE_ANON_KEY="$ANON_KEY"
          export TEST_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm run test:profile-api
          npm run test:friends-api
