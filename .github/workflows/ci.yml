name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:passkey
      - run: npm run build
  profile-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - name: Test profile permissions through the API
        shell: bash
        run: |
          eval "$(npx supabase status -o env)"
          export TEST_SUPABASE_URL="$API_URL"
          export TEST_SUPABASE_ANON_KEY="$ANON_KEY"
          export TEST_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm run test:profile-api
          npm run test:friends-api
          npm run test:location-api
          npx supabase functions serve delete-account > "$RUNNER_TEMP/near-edge.log" 2>&1 &
          near_functions_pid=$!
          trap 'code=$?; if [ "$code" -ne 0 ]; then cat "$RUNNER_TEMP/near-edge.log"; fi; kill "$near_functions_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$API_URL/functions/v1/delete-account" || true)
            if [ "$status" = "200" ]; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then echo 'Edge Function did not become ready'; exit 1; fi
          npm run test:delete-account-api
